name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 零运行时依赖：不跑 npm ci，直接用宿主 Node 的测试运行器。
      - name: Unit and integration tests
        run: npm test

      - name: Coverage gate
        run: npm run test:coverage
